<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technical Interview Question Bank</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .star-btn { cursor: pointer; user-select: none; transition: transform 0.1s; }
  .star-btn:hover { transform: scale(1.2); }
  .question-card { transition: all 0.2s ease; }
  .question-card:hover { border-color: #4b5563; }
  .tab-btn.active { background: #2563eb; color: #fff; }
  .tab-btn { transition: background 0.15s; }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
<div class="max-w-4xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-center mb-1">Technical Interview Question Bank</h1>
  <p class="text-center text-gray-400 text-sm mb-6">Rate each question by your confidence (1–5). Progress is saved locally.</p>

  <!-- Category Tabs -->
  <div class="flex flex-wrap gap-2 mb-6">
    <button onclick="setCategory('all')" id="tab-all" class="tab-btn active px-4 py-2 rounded-lg text-sm font-medium bg-gray-800 hover:bg-blue-600">All</button>
    <button onclick="setCategory('algo')" id="tab-algo" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-800 hover:bg-blue-600">Algorithms</button>
    <button onclick="setCategory('ds')" id="tab-ds" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-800 hover:bg-blue-600">Data Structures</button>
    <button onclick="setCategory('system')" id="tab-system" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-800 hover:bg-blue-600">System Design</button>
    <button onclick="setCategory('db')" id="tab-db" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-800 hover:bg-blue-600">Database</button>
    <button onclick="setCategory('network')" id="tab-network" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-800 hover:bg-blue-600">Networking</button>
  </div>

  <!-- Proficiency Chart -->
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 mb-6">
    <h2 class="text-base font-semibold text-gray-300 mb-3">Category Proficiency</h2>
    <canvas id="profChart" height="120"></canvas>
    <div class="flex flex-wrap gap-3 mt-3 text-xs text-gray-400" id="chart-legend"></div>
  </div>

  <!-- Question List -->
  <div id="question-list" class="space-y-3"></div>
</div>

<script>
const QUESTIONS = [
  // Algorithms
  { id: 'algo1', cat: 'algo', catLabel: 'Algorithms', q: 'Explain the time and space complexity of QuickSort in the best, average, and worst cases.' },
  { id: 'algo2', cat: 'algo', catLabel: 'Algorithms', q: 'How does Dijkstra\'s algorithm work? What are its limitations, and how does A* improve on it?' },
  { id: 'algo3', cat: 'algo', catLabel: 'Algorithms', q: 'Describe the divide-and-conquer approach. Provide an example beyond MergeSort.' },
  { id: 'algo4', cat: 'algo', catLabel: 'Algorithms', q: 'What is dynamic programming? Explain with the Knapsack or Longest Common Subsequence problem.' },
  { id: 'algo5', cat: 'algo', catLabel: 'Algorithms', q: 'What is the difference between BFS and DFS? When would you prefer one over the other?' },
  { id: 'algo6', cat: 'algo', catLabel: 'Algorithms', q: 'Explain the Boyer-Moore Voting Algorithm and its use case.' },
  // Data Structures
  { id: 'ds1', cat: 'ds', catLabel: 'Data Structures', q: 'Compare HashMap and TreeMap. When would you use each and what are the trade-offs?' },
  { id: 'ds2', cat: 'ds', catLabel: 'Data Structures', q: 'Explain how a Red-Black Tree maintains balance. What are insertion rebalancing cases?' },
  { id: 'ds3', cat: 'ds', catLabel: 'Data Structures', q: 'What is a Bloom Filter? Describe its false-positive characteristics and practical applications.' },
  { id: 'ds4', cat: 'ds', catLabel: 'Data Structures', q: 'Explain the difference between a stack and a queue. How would you implement a queue using two stacks?' },
  { id: 'ds5', cat: 'ds', catLabel: 'Data Structures', q: 'What is a Trie (prefix tree)? Describe its advantages over a hash map for string key lookups.' },
  { id: 'ds6', cat: 'ds', catLabel: 'Data Structures', q: 'How does a Skip List work, and how does its average complexity compare to a balanced BST?' },
  // System Design
  { id: 'sys1', cat: 'system', catLabel: 'System Design', q: 'Design a URL shortener (e.g. bit.ly). Discuss hashing strategy, storage, and redirect mechanics.' },
  { id: 'sys2', cat: 'system', catLabel: 'System Design', q: 'How would you design a distributed rate limiter that works across multiple API servers?' },
  { id: 'sys3', cat: 'system', catLabel: 'System Design', q: 'Explain the differences between SQL and NoSQL databases and when you\'d choose each for a new system.' },
  { id: 'sys4', cat: 'system', catLabel: 'System Design', q: 'How does consistent hashing work and why is it useful in distributed systems like Memcached?' },
  { id: 'sys5', cat: 'system', catLabel: 'System Design', q: 'Design a notification system that supports push, email, and SMS. Focus on fan-out strategies.' },
  { id: 'sys6', cat: 'system', catLabel: 'System Design', q: 'Explain CAP theorem. Give real-world examples of AP and CP system trade-offs.' },
  // Database
  { id: 'db1', cat: 'db', catLabel: 'Database', q: 'Explain database normalization (1NF, 2NF, 3NF). When is denormalization appropriate?' },
  { id: 'db2', cat: 'db', catLabel: 'Database', q: 'What is a B+ Tree index? How does it improve read performance and what is its write overhead?' },
  { id: 'db3', cat: 'db', catLabel: 'Database', q: 'Describe the ACID properties. How does MVCC (Multi-Version Concurrency Control) implement them?' },
  { id: 'db4', cat: 'db', catLabel: 'Database', q: 'What are the four SQL isolation levels and what anomalies does each prevent (dirty read, phantom read, etc.)?' },
  { id: 'db5', cat: 'db', catLabel: 'Database', q: 'How would you optimize a slow SQL query? Walk through your debugging process step by step.' },
  { id: 'db6', cat: 'db', catLabel: 'Database', q: 'Explain the difference between clustered and non-clustered indexes. How do they affect INSERT and SELECT performance?' },
  // Networking
  { id: 'net1', cat: 'network', catLabel: 'Networking', q: 'Explain the full lifecycle of an HTTP request from DNS lookup to response rendering.' },
  { id: 'net2', cat: 'network', catLabel: 'Networking', q: 'What is the TCP three-way handshake? How does TCP ensure reliable delivery?' },
  { id: 'net3', cat: 'network', catLabel: 'Networking', q: 'Compare HTTP/1.1, HTTP/2, and HTTP/3. What specific bottlenecks does each version address?' },
  { id: 'net4', cat: 'network', catLabel: 'Networking', q: 'What is a CDN and how does it reduce latency? Explain cache invalidation strategies.' },
  { id: 'net5', cat: 'network', catLabel: 'Networking', q: 'Explain WebSockets vs. Server-Sent Events vs. Long Polling. When would you use each?' },
  { id: 'net6', cat: 'network', catLabel: 'Networking', q: 'How does TLS/SSL work? Describe the handshake and what symmetric/asymmetric encryption roles each play.' },
];

const CAT_COLORS = {
  algo:    '#3b82f6',
  ds:      '#8b5cf6',
  system:  '#f59e0b',
  db:      '#10b981',
  network: '#ef4444',
};
const CAT_LABELS = { algo: 'Algorithms', ds: 'Data Structures', system: 'System Design', db: 'Database', network: 'Networking' };
const CATS = Object.keys(CAT_LABELS);

let currentCat = 'all';
let ratings = {};

function loadRatings() {
  try { ratings = JSON.parse(localStorage.getItem('iqb-ratings') || '{}'); } catch { ratings = {}; }
}
function saveRatings() {
  localStorage.setItem('iqb-ratings', JSON.stringify(ratings));
}

function setCategory(cat) {
  currentCat = cat;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'bg-blue-600'));
  const btn = document.getElementById('tab-' + cat);
  if (btn) { btn.classList.add('active'); btn.classList.remove('bg-gray-800'); }
  renderQuestions();
}

function setRating(id, val) {
  ratings[id] = val;
  saveRatings();
  renderQuestions();
  drawChart();
}

function renderQuestions() {
  const list = document.getElementById('question-list');
  const filtered = currentCat === 'all' ? QUESTIONS : QUESTIONS.filter(q => q.cat === currentCat);
  list.innerHTML = filtered.map((q, i) => {
    const r = ratings[q.id] || 0;
    const stars = [1,2,3,4,5].map(v => {
      const filled = v <= r;
      const color = filled ? '#f59e0b' : '#374151';
      return `<span class="star-btn text-2xl" onclick="setRating('${q.id}', ${v})" title="Rate ${v}" style="color:${color}">★</span>`;
    }).join('');
    const catColor = CAT_COLORS[q.cat];
    return `
      <div class="question-card bg-gray-900 border border-gray-800 rounded-xl p-4">
        <div class="flex items-start justify-between gap-4">
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-2">
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full" style="background:${catColor}22; color:${catColor}">${q.catLabel}</span>
              <span class="text-xs text-gray-500">Q${i+1}</span>
            </div>
            <p class="text-gray-200 text-sm leading-relaxed">${q.q}</p>
          </div>
          <div class="flex flex-col items-center gap-1 shrink-0">
            <div class="flex">${stars}</div>
            <span class="text-xs text-gray-500">${r > 0 ? `${r}/5` : 'Rate'}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

function drawChart() {
  const canvas = document.getElementById('profChart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth;
  const H = 120;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const barW = Math.floor(W / CATS.length);
  const maxScore = 5;
  const padTop = 10, padBottom = 30, padSide = 10;
  const chartH = H - padTop - padBottom;

  // Grid
  ctx.strokeStyle = '#1f2937';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 5; i++) {
    const y = padTop + chartH - (i / maxScore) * chartH;
    ctx.beginPath(); ctx.moveTo(padSide, y); ctx.lineTo(W - padSide, y); ctx.stroke();
  }

  CATS.forEach((cat, i) => {
    const qs = QUESTIONS.filter(q => q.cat === cat);
    const rated = qs.filter(q => ratings[q.id]);
    const avg = rated.length ? rated.reduce((s, q) => s + (ratings[q.id] || 0), 0) / qs.length : 0;
    const pct = avg / maxScore;

    const x = padSide + i * (barW) + barW * 0.1;
    const bw = barW * 0.8;
    const barH = pct * chartH;
    const y = padTop + chartH - barH;

    // Bar bg
    ctx.fillStyle = '#1f2937';
    ctx.beginPath();
    ctx.roundRect(x, padTop, bw, chartH, 4);
    ctx.fill();

    // Bar fill
    ctx.fillStyle = CAT_COLORS[cat];
    if (barH > 0) {
      ctx.beginPath();
      ctx.roundRect(x, y, bw, barH, 4);
      ctx.fill();
    }

    // Label
    ctx.fillStyle = '#9ca3af';
    ctx.font = `10px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    const short = { algo:'Algo', ds:'D.S.', system:'System', db:'DB', network:'Net' };
    ctx.fillText(short[cat], x + bw / 2, H - 14);

    // Score
    ctx.fillStyle = avg > 0 ? CAT_COLORS[cat] : '#4b5563';
    ctx.font = `bold 11px system-ui, sans-serif`;
    ctx.fillText(avg > 0 ? avg.toFixed(1) : '-', x + bw / 2, H - 3);
  });

  // Legend
  const legend = document.getElementById('chart-legend');
  legend.innerHTML = CATS.map(cat => {
    const qs = QUESTIONS.filter(q => q.cat === cat);
    const rated = qs.filter(q => ratings[q.id]);
    return `<span style="color:${CAT_COLORS[cat]}">${CAT_LABELS[cat]}: ${rated.length}/${qs.length} rated</span>`;
  }).join(' · ');
}

loadRatings();
renderQuestions();

window.addEventListener('load', () => {
  setTimeout(drawChart, 50);
});
window.addEventListener('resize', drawChart);
</script>
</body>
</html>
